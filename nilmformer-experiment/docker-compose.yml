# NILMFormer experiments (GPU). Run from this folder; independent from ../backend.
name: wattprint-nilm
x-nilm: &nilm
  build: .
  env_file: .env
  volumes:
    - ./NILMFormer/data:/app/data
    - ./results:/app/result
    - ./artifacts:/app/artifacts
    - ./pipeline:/app/pipeline
    - ./service:/app/service
  shm_size: "2gb"

services:
  # train / predict / postprocess:
  #   docker compose run --rm pipeline python -m pipeline.<step> ...
  pipeline:
    <<: *nilm
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # one-off: docker compose --profile tools run --rm download-refit
  download-refit:
    <<: *nilm
    profiles: ["tools"]
    command: ["python", "tools/download_refit.py"]

  # all REFIT appliances: docker compose run --rm all-appliances
  all-appliances:
    <<: *nilm
    command: ["sh", "tools/run_appliances.sh"]
    deploy: &gpu
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # docker compose run --rm experiment
  experiment:
    <<: *nilm
    command: >
      python -m scripts.run_one_expe
      --dataset ${DATASET} --sampling_rate ${SAMPLING_RATE}
      --appliance ${APPLIANCE} --window_size ${WINDOW_SIZE}
      --name_model ${MODEL} --seed ${SEED}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Inference API (POST /disaggregate). Models are read from ./artifacts/models.
  # Start with: docker compose up -d inference
  inference:
    <<: *nilm
    command: ["uvicorn", "service.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "${INFERENCE_PORT:-8002}:8000"
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
